name = "chat-fiap-fotos"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# O bucket precisa existir antes do primeiro deploy:
#   npx wrangler r2 bucket create chat-fiap-fotos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "chat-fiap-fotos"

[vars]
FIREBASE_PROJECT_ID = "chat-firebase-fiap"
ALLOWED_ORIGINS = "*"
